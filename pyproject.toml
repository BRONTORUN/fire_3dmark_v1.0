[project]
name = "fire-3dmark"
version = "1.0.0"
description = "Fixed-view scale-free 3D flame primitive annotation tool"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
